# nginx.conf example for stable streaming - giảm thiểu ngắt kết nối publisher

events {
    worker_connections 1024;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    server {
        listen 80;
        server_name localhost;
        
        location / {
            root /var/www/html;
            index index.html;
        }
        
        # Status page for monitoring
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /path/to/nginx-rtmp-module;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        application live {
            live on;
            
            # *** CÁC THIẾT LẬP QUAN TRỌNG ĐỂ TRÁNH NGẮT KẾT NỐI ***
            
            # Tăng idle timeout để tránh ngắt kết nối publisher
            # Mặc định là 0 (tắt), đặt cao để tránh ngắt nhầm
            drop_idle_publisher 300s;  # 5 phút thay vì mặc định
            
            # Giữ kết nối subscribers khi publisher tạm ngắt
            keep_connections on;
            reconnect_timeout 30s;
            
            # Buffer và sync settings
            buffer 5s;
            sync 10ms;
            
            # Chờ key frame để đảm bảo quality
            wait_key on;
            wait_video off;
            
            # Interleave để cải thiện performance  
            interleave on;
            
            # Notification settings
            publish_notify on;
            play_restart off;
            
            # Cho phép idle streams
            idle_streams on;
            
            # *** LOGGING ĐỂ DEBUG ***
            access_log /var/log/nginx/rtmp_access.log;
            
            # *** PUBLISHER SETTINGS ***
            # Chỉ cho phép từ localhost hoặc IP cụ thể
            allow publish 127.0.0.1;
            allow publish 192.168.0.0/16;
            allow publish 10.0.0.0/8;
            deny publish all;
            
            # *** SUBSCRIBER SETTINGS ***  
            # Cho phép play từ mọi nơi
            allow play all;
            
            # *** PUSH/PULL SETTINGS (nếu cần) ***
            # Uncomment nếu muốn push đến server khác
            # push rtmp://other-server/live/;
            
            # *** RECORD SETTINGS (nếu cần) ***
            # record all;
            # record_path /var/recordings;
            # record_suffix .flv;
            # record_unique on;
        }
        
        # Application khác cho HLS (nếu cần)
        application hls {
            live on;
            hls on;
            hls_path /var/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            
            # Cùng settings như live
            drop_idle_publisher 300s;
            keep_connections on;
            reconnect_timeout 30s;
        }
    }
}

# Các thiết lập bổ sung trong nginx.conf chính

# Error log với level info để thấy debug logs
error_log /var/log/nginx/error.log info;

# Worker process settings
worker_processes auto;
worker_rlimit_nofile 65535;

# Pid file
pid /var/run/nginx.pid;
